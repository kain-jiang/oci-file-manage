<!DOCTYPE html>
<html lang="zh" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史</title>
    <style id="theme-vars">
/* OCI Sync Android — Material 3 brand tokens */

:root {
  /* Primary hue: indigo 600 base */
  --oci-primary-50: #eef2ff;
  --oci-primary-100: #e0e7ff;
  --oci-primary-200: #c7d2fe;
  --oci-primary-300: #a5b4fc;
  --oci-primary-400: #818cf8;
  --oci-primary-500: #6366f1;
  --oci-primary-600: #4f46e5;
  --oci-primary-700: #4338ca;
  --oci-primary-800: #3730a3;
  --oci-primary-900: #312e81;

  /* Neutral scale */
  --oci-neutral-0: #ffffff;
  --oci-neutral-50: #f8fafc;
  --oci-neutral-100: #f1f5f9;
  --oci-neutral-200: #e2e8f0;
  --oci-neutral-300: #cbd5e1;
  --oci-neutral-400: #94a3b8;
  --oci-neutral-500: #64748b;
  --oci-neutral-600: #475569;
  --oci-neutral-700: #334155;
  --oci-neutral-800: #1e293b;
  --oci-neutral-900: #0f172a;
  --oci-neutral-950: #020617;

  /* State colors */
  --oci-state-success: #16a34a;
  --oci-state-success-bg: #dcfce7;
  --oci-state-warning: #ca8a04;
  --oci-state-warning-bg: #fef9c3;
  --oci-state-error: #dc2626;
  --oci-state-error-bg: #fee2e2;
  --oci-state-info: #2563eb;
  --oci-state-info-bg: #dbeafe;

  /* Radius */
  --oci-radius-small: 4px;
  --oci-radius-medium: 8px;
  --oci-radius-large: 16px;
  --oci-radius-full: 9999px;

  /* Shadows */
  --oci-shadow-1: 0 1px 2px 0 rgba(15, 23, 42, 0.05), 0 1px 1px 0 rgba(15, 23, 42, 0.03);
  --oci-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.05);
  --oci-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.05);

  /* Typography */
  --oci-font-sans: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --oci-font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;

  /* Spacing */
  --oci-s-1: 4px;
  --oci-s-2: 8px;
  --oci-s-3: 12px;
  --oci-s-4: 16px;
  --oci-s-5: 24px;
  --oci-s-6: 32px;

  /* Semantic aliases — light mode defaults */
  --oci-background: #f8fafc;
  --oci-foreground: #0f172a;
  --oci-card: #ffffff;
  --oci-card-foreground: #0f172a;
  --oci-popover: #ffffff;
  --oci-popover-foreground: #0f172a;
  --oci-primary: #4f46e5;
  --oci-primary-foreground: #ffffff;
  --oci-muted: #f1f5f9;
  --oci-muted-foreground: #64748b;
  --oci-border: #e2e8f0;
  --oci-input: #e2e8f0;
  --oci-ring: #4f46e5;
  --oci-surface: #ffffff;
  --oci-surface-2: #f8fafc;
  --oci-ink: #0f172a;
  --oci-ink-2: #475569;
  --oci-ink-3: #64748b;
  --oci-line: #e2e8f0;
}

html.light {
  --oci-background: #f8fafc;
  --oci-foreground: #0f172a;
  --oci-card: #ffffff;
  --oci-card-foreground: #0f172a;
  --oci-popover: #ffffff;
  --oci-popover-foreground: #0f172a;
  --oci-primary: #4f46e5;
  --oci-primary-foreground: #ffffff;
  --oci-muted: #f1f5f9;
  --oci-muted-foreground: #64748b;
  --oci-border: #e2e8f0;
  --oci-input: #e2e8f0;
  --oci-ring: #4f46e5;
  --oci-surface: #ffffff;
  --oci-surface-2: #f8fafc;
  --oci-ink: #0f172a;
  --oci-ink-2: #475569;
  --oci-ink-3: #64748b;
  --oci-line: #e2e8f0;
}

html.dark {
  --oci-background: #0b0b0f;
  --oci-foreground: #f8fafc;
  --oci-card: #14141a;
  --oci-card-foreground: #f8fafc;
  --oci-popover: #1c1c24;
  --oci-popover-foreground: #f8fafc;
  --oci-primary: #818cf8;
  --oci-primary-foreground: #0f172a;
  --oci-muted: #1c1c24;
  --oci-muted-foreground: #94a3b8;
  --oci-border: #27272f;
  --oci-input: #27272f;
  --oci-ring: #818cf8;
  --oci-surface: #14141a;
  --oci-surface-2: #1c1c24;
  --oci-ink: #f8fafc;
  --oci-ink-2: #cbd5e1;
  --oci-ink-3: #94a3b8;
  --oci-line: #27272f;
}

/* Semantic aliases required by head contract */
:root {
  --oci-primary-50-alias: var(--oci-primary-50);
  --oci-primary-100-alias: var(--oci-primary-100);
  --oci-primary-900-alias: var(--oci-primary-900);
}

/* Utility classes */
.font-sans { font-family: var(--oci-font-sans); }
.font-mono { font-family: var(--oci-font-mono); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">

    --color-popover: var(--oci-popover);

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

<body class="min-h-screen font-sans antialiased bg-background text-foreground">
    <div class="mx-auto min-h-screen max-w-md bg-background shadow-2xl">
      <!-- Header -->
      <header class="sticky top-0 z-20 flex items-center justify-between bg-background/95 px-4 py-3 backdrop-blur-sm">
        <h1 class="text-xl font-semibold tracking-tight text-foreground">活动历史</h1>
        <button data-dom-id="btn-clear" class="text-sm font-medium text-primary transition-colors active:opacity-60">
          清空
        </button>
      </header>

      <!-- Filter chips -->
      <div class="no-scrollbar sticky top-[52px] z-10 flex gap-2 overflow-x-auto bg-background/95 px-4 py-2 backdrop-blur-sm">
        <button data-dom-id="filter-all" class="shrink-0 rounded-full bg-primary px-4 py-1.5 text-sm font-medium text-primary-foreground shadow-sm transition active:scale-95">
          全部
        </button>
        <button data-dom-id="filter-push" class="shrink-0 rounded-full border border-border bg-surface px-4 py-1.5 text-sm font-medium text-ink-2 transition hover:bg-muted active:scale-95">
          推送
        </button>
        <button class="shrink-0 rounded-full border border-border bg-surface px-4 py-1.5 text-sm font-medium text-ink-2 transition hover:bg-muted active:scale-95">
          拉取
        </button>
        <button class="shrink-0 rounded-full border border-border bg-surface px-4 py-1.5 text-sm font-medium text-ink-2 transition hover:bg-muted active:scale-95">
          删除
        </button>
        <button class="shrink-0 rounded-full border border-border bg-surface px-4 py-1.5 text-sm font-medium text-ink-2 transition hover:bg-muted active:scale-95">
          标签
        </button>
      </div>

      <!-- Activity list -->
      <main class="space-y-3 px-4 pb-28 pt-3">
        <!-- Item 1 -->
        <article class="flex items-center gap-4 rounded-2xl bg-card p-4 shadow-sm transition active:scale-[0.99]">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[var(--oci-primary-100)] text-primary">
            <i data-lucide="arrow-up-from-line" class="h-5 w-5"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between gap-2">
              <p class="truncate text-[15px] font-medium text-foreground">work/files:v1.2</p>
              <span class="flex items-center gap-1 text-xs font-medium text-[var(--oci-state-success)]">
                <i data-lucide="check-circle-2" class="h-3.5 w-3.5"></i>成功
              </span>
            </div>
            <div class="mt-1 flex items-center gap-2 text-xs text-muted-foreground">
              <span>推送</span>
              <span class="h-1 w-1 rounded-full bg-muted-foreground/50"></span>
              <span>刚刚</span>
            </div>
          </div>
        </article>

        <!-- Item 2 -->
        <article class="flex items-center gap-4 rounded-2xl bg-card p-4 shadow-sm transition active:scale-[0.99]">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[var(--oci-primary-100)] text-primary">
            <i data-lucide="arrow-down-to-line" class="h-5 w-5"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between gap-2">
              <p class="truncate text-[15px] font-medium text-foreground">personal/files:latest</p>
              <span class="flex items-center gap-1 text-xs font-medium text-[var(--oci-state-success)]">
                <i data-lucide="check-circle-2" class="h-3.5 w-3.5"></i>成功
              </span>
            </div>
            <div class="mt-1 flex items-center gap-2 text-xs text-muted-foreground">
              <span>拉取</span>
              <span class="h-1 w-1 rounded-full bg-muted-foreground/50"></span>
              <span>10:30</span>
            </div>
          </div>
        </article>

        <!-- Item 3 -->
        <article class="flex items-center gap-4 rounded-2xl bg-card p-4 shadow-sm transition active:scale-[0.99]">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[var(--oci-state-error-bg)] text-[var(--oci-state-error)]">
            <i data-lucide="trash-2" class="h-5 w-5"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between gap-2">
              <p class="truncate text-[15px] font-medium text-foreground">shared/docs:v2</p>
              <span class="flex items-center gap-1 text-xs font-medium text-[var(--oci-state-success)]">
                <i data-lucide="check-circle-2" class="h-3.5 w-3.5"></i>成功
              </span>
            </div>
            <div class="mt-1 flex items-center gap-2 text-xs text-muted-foreground">
              <span>删除</span>
              <span class="h-1 w-1 rounded-full bg-muted-foreground/50"></span>
              <span>昨天</span>
            </div>
          </div>
        </article>

        <!-- Item 4 -->
        <article class="flex items-center gap-4 rounded-2xl bg-card p-4 shadow-sm transition active:scale-[0.99]">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[var(--oci-state-warning-bg)] text-[var(--oci-state-warning)]">
            <i data-lucide="tag" class="h-5 w-5"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between gap-2">
              <p class="truncate text-[15px] font-medium text-foreground">work/files:v1.1</p>
              <span class="flex items-center gap-1 text-xs font-medium text-[var(--oci-state-success)]">
                <i data-lucide="check-circle-2" class="h-3.5 w-3.5"></i>成功
              </span>
            </div>
            <div class="mt-1 flex items-center gap-2 text-xs text-muted-foreground">
              <span>标签</span>
              <span class="h-1 w-1 rounded-full bg-muted-foreground/50"></span>
              <span>昨天</span>
            </div>
          </div>
        </article>
      

</main>

      <!-- Bottom tab navigation -->
      
    </div>

    <script>lucide.createIcons();</script>

  <div class="w-full max-w-md mx-auto grid grid-cols-3 h-[64px]">
        <a href="home.html" data-nav-key="home" data-dom-id="nav-home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--oci-ink-3)]">
          <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span>
        </a>
        <a href="browse.html" data-nav-key="browse" data-dom-id="nav-browse" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--oci-ink-3)]">
          <i data-lucide="package" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">仓库</span>
        </a>
        <a href="history.html" data-nav-key="history" data-dom-id="nav-history" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--oci-primary)] font-medium">
          <i data-lucide="clock" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">历史</span>
        </a>
      </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
