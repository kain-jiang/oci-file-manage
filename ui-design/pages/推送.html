<!DOCTYPE html>
<html lang="zh" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推送</title>
    <style id="theme-vars">
/* OCI Sync Android — Material 3 brand tokens */

:root {
  /* Primary hue: indigo 600 base */
  --oci-primary-50: #eef2ff;
  --oci-primary-100: #e0e7ff;
  --oci-primary-200: #c7d2fe;
  --oci-primary-300: #a5b4fc;
  --oci-primary-400: #818cf8;
  --oci-primary-500: #6366f1;
  --oci-primary-600: #4f46e5;
  --oci-primary-700: #4338ca;
  --oci-primary-800: #3730a3;
  --oci-primary-900: #312e81;

  /* Neutral scale */
  --oci-neutral-0: #ffffff;
  --oci-neutral-50: #f8fafc;
  --oci-neutral-100: #f1f5f9;
  --oci-neutral-200: #e2e8f0;
  --oci-neutral-300: #cbd5e1;
  --oci-neutral-400: #94a3b8;
  --oci-neutral-500: #64748b;
  --oci-neutral-600: #475569;
  --oci-neutral-700: #334155;
  --oci-neutral-800: #1e293b;
  --oci-neutral-900: #0f172a;
  --oci-neutral-950: #020617;

  /* State colors */
  --oci-state-success: #16a34a;
  --oci-state-success-bg: #dcfce7;
  --oci-state-warning: #ca8a04;
  --oci-state-warning-bg: #fef9c3;
  --oci-state-error: #dc2626;
  --oci-state-error-bg: #fee2e2;
  --oci-state-info: #2563eb;
  --oci-state-info-bg: #dbeafe;

  /* Radius */
  --oci-radius-small: 4px;
  --oci-radius-medium: 8px;
  --oci-radius-large: 16px;
  --oci-radius-full: 9999px;

  /* Shadows */
  --oci-shadow-1: 0 1px 2px 0 rgba(15, 23, 42, 0.05), 0 1px 1px 0 rgba(15, 23, 42, 0.03);
  --oci-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.05);
  --oci-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.05);

  /* Typography */
  --oci-font-sans: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --oci-font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;

  /* Spacing */
  --oci-s-1: 4px;
  --oci-s-2: 8px;
  --oci-s-3: 12px;
  --oci-s-4: 16px;
  --oci-s-5: 24px;
  --oci-s-6: 32px;

  /* Semantic aliases — light mode defaults */
  --oci-background: #f8fafc;
  --oci-foreground: #0f172a;
  --oci-card: #ffffff;
  --oci-card-foreground: #0f172a;
  --oci-popover: #ffffff;
  --oci-popover-foreground: #0f172a;
  --oci-primary: #4f46e5;
  --oci-primary-foreground: #ffffff;
  --oci-muted: #f1f5f9;
  --oci-muted-foreground: #64748b;
  --oci-border: #e2e8f0;
  --oci-input: #e2e8f0;
  --oci-ring: #4f46e5;
  --oci-surface: #ffffff;
  --oci-surface-2: #f8fafc;
  --oci-ink: #0f172a;
  --oci-ink-2: #475569;
  --oci-ink-3: #64748b;
  --oci-line: #e2e8f0;
}

html.light {
  --oci-background: #f8fafc;
  --oci-foreground: #0f172a;
  --oci-card: #ffffff;
  --oci-card-foreground: #0f172a;
  --oci-popover: #ffffff;
  --oci-popover-foreground: #0f172a;
  --oci-primary: #4f46e5;
  --oci-primary-foreground: #ffffff;
  --oci-muted: #f1f5f9;
  --oci-muted-foreground: #64748b;
  --oci-border: #e2e8f0;
  --oci-input: #e2e8f0;
  --oci-ring: #4f46e5;
  --oci-surface: #ffffff;
  --oci-surface-2: #f8fafc;
  --oci-ink: #0f172a;
  --oci-ink-2: #475569;
  --oci-ink-3: #64748b;
  --oci-line: #e2e8f0;
}

html.dark {
  --oci-background: #0b0b0f;
  --oci-foreground: #f8fafc;
  --oci-card: #14141a;
  --oci-card-foreground: #f8fafc;
  --oci-popover: #1c1c24;
  --oci-popover-foreground: #f8fafc;
  --oci-primary: #818cf8;
  --oci-primary-foreground: #0f172a;
  --oci-muted: #1c1c24;
  --oci-muted-foreground: #94a3b8;
  --oci-border: #27272f;
  --oci-input: #27272f;
  --oci-ring: #818cf8;
  --oci-surface: #14141a;
  --oci-surface-2: #1c1c24;
  --oci-ink: #f8fafc;
  --oci-ink-2: #cbd5e1;
  --oci-ink-3: #94a3b8;
  --oci-line: #27272f;
}

/* Semantic aliases required by head contract */
:root {
  --oci-primary-50-alias: var(--oci-primary-50);
  --oci-primary-100-alias: var(--oci-primary-100);
  --oci-primary-900-alias: var(--oci-primary-900);
}

/* Utility classes */
.font-sans { font-family: var(--oci-font-sans); }
.font-mono { font-family: var(--oci-font-mono); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--oci-background);
    --color-foreground: var(--oci-foreground);
    --color-card: var(--oci-card);
    --color-card-foreground: var(--oci-card-foreground);
    --color-popover: var(--oci-popover);
    --color-popover-foreground: var(--oci-popover-foreground);
    --color-primary: var(--oci-primary);
    --color-primary-foreground: var(--oci-primary-foreground);
    --color-muted: var(--oci-muted);
    --color-muted-foreground: var(--oci-muted-foreground);
    --color-border: var(--oci-border);
    --color-input: var(--oci-input);
    --color-ring: var(--oci-ring);
    --radius-sm: var(--oci-radius-small);
    --radius-md: var(--oci-radius-medium);
    --radius-lg: var(--oci-radius-large);
  }
  @layer base {
    body { background: var(--oci-background); color: var(--oci-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--oci-background); }
      .text-background { color: var(--oci-background); }
      .border-background { border-color: var(--oci-background); }
      .ring-background { --tw-ring-color: var(--oci-background); }
      .bg-foreground { background-color: var(--oci-foreground); }
      .text-foreground { color: var(--oci-foreground); }
      .border-foreground { border-color: var(--oci-foreground); }
      .ring-foreground { --tw-ring-color: var(--oci-foreground); }
      .bg-card { background-color: var(--oci-card); }
      .text-card { color: var(--oci-card); }
      .border-card { border-color: var(--oci-card); }
      .ring-card { --tw-ring-color: var(--oci-card); }
      .bg-card-foreground { background-color: var(--oci-card-foreground); }
      .text-card-foreground { color: var(--oci-card-foreground); }
      .border-card-foreground { border-color: var(--oci-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--oci-card-foreground); }
      .bg-popover { background-color: var(--oci-popover); }
      .text-popover { color: var(--oci-popover); }
      .border-popover { border-color: var(--oci-popover); }
      .ring-popover { --tw-ring-color: var(--oci-popover); }
      .bg-popover-foreground { background-color: var(--oci-popover-foreground); }
      .text-popover-foreground { color: var(--oci-popover-foreground); }
      .border-popover-foreground { border-color: var(--oci-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--oci-popover-foreground); }
      .bg-primary { background-color: var(--oci-primary); }
      .text-primary { color: var(--oci-primary); }
      .border-primary { border-color: var(--oci-primary); }
      .ring-primary { --tw-ring-color: var(--oci-primary); }
      .bg-primary-foreground { background-color: var(--oci-primary-foreground); }
      .text-primary-foreground { color: var(--oci-primary-foreground); }
      .border-primary-foreground { border-color: var(--oci-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--oci-primary-foreground); }
      .bg-muted { background-color: var(--oci-muted); }
      .text-muted { color: var(--oci-muted); }
      .border-muted { border-color: var(--oci-muted); }
      .ring-muted { --tw-ring-color: var(--oci-muted); }
      .bg-muted-foreground { background-color: var(--oci-muted-foreground); }
      .text-muted-foreground { color: var(--oci-muted-foreground); }
      .border-muted-foreground { border-color: var(--oci-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--oci-muted-foreground); }
      .bg-border { background-color: var(--oci-border); }
      .text-border { color: var(--oci-border); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-background text-foreground">
    <style id="critical-layout">
      :root {
        --oci-push-header-height: 56px;
        --oci-push-action-height: 132px;
      }
      .page-header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: var(--oci-push-header-height);
        padding: 0 var(--oci-s-4);
        background: var(--oci-card);
        border-bottom: 1px solid var(--oci-line);
      }
      .page-header__title {
        flex: 1 1 auto;
        text-align: center;
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--oci-ink);
      }
      .page-main {
        max-width: 100%;
        padding: var(--oci-s-4);
        padding-bottom: calc(var(--oci-push-action-height) + var(--oci-s-4));
      }
      .oci-card {
        background: var(--oci-card);
        border: 1px solid var(--oci-line);
        border-radius: var(--oci-radius-large);
        padding: var(--oci-s-4);
        margin-bottom: var(--oci-s-4);
        box-shadow: var(--oci-shadow-1);
      }
      .oci-input {
        width: 100%;
        min-height: 44px;
        padding: var(--oci-s-2) var(--oci-s-3);
        border: 1px solid var(--oci-input);
        border-radius: var(--oci-radius-medium);
        background: var(--oci-surface);
        color: var(--oci-ink);
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      .oci-input:focus {
        outline: none;
        border-color: var(--oci-ring);
        box-shadow: 0 0 0 3px var(--oci-primary-100-alias);
      }
      .oci-label {
        display: block;
        margin-bottom: var(--oci-s-2);
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--oci-ink-2);
      }
      .oci-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--oci-s-2);
        min-height: 44px;
        padding: var(--oci-s-2) var(--oci-s-4);
        border-radius: var(--oci-radius-medium);
        font-size: 0.9375rem;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        background: transparent;
        color: var(--oci-primary);
      }
      .oci-btn--primary {
        width: 100%;
        min-height: 52px;
        background: var(--oci-primary);
        color: var(--oci-primary-foreground);
        border-radius: var(--oci-radius-large);
        font-size: 1rem;
        font-weight: 600;
      }
      .oci-btn--tonal {
        background: var(--oci-muted);
        color: var(--oci-ink);
        border: 1px solid var(--oci-line);
      }
      .action-area {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 64px;
        z-index: 20;
        background: var(--oci-card);
        border-top: 1px solid var(--oci-line);
        padding: var(--oci-s-4);
      }
      .progress-track {
        width: 100%;
        height: 6px;
        background: var(--oci-neutral-200);
        border-radius: var(--oci-radius-full);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--oci-primary);
        width: 0%;
        transition: width 0.25s ease;
      }
      .selected-path {
        word-break: break-all;
        overflow-wrap: anywhere;
      }
      .tag-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--oci-s-2);
        padding: var(--oci-s-2) 0;
        border-bottom: 1px solid var(--oci-line);
      }
      .tag-row:last-child {
        border-bottom: none;
      }
      .checkbox-wrap {
        display: inline-flex;
        align-items: center;
        gap: var(--oci-s-2);
        margin-top: var(--oci-s-3);
        font-size: 0.875rem;
        color: var(--oci-ink-2);
      }
      .checkbox-wrap input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--oci-primary);
      }
    </style>

    <header class="page-header">
      <button type="button" class="oci-btn p-2 -ml-2" data-dom-id="back-home" aria-label="返回">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
      </button>
      <h1 class="page-header__title">推送文件</h1>
      <span class="w-10" aria-hidden="true"></span>
    </header>

    <main class="page-main">
      <section class="oci-card">
        <h2 class="text-base font-semibold text-foreground mb-3">本地路径</h2>
        <button type="button" class="oci-btn oci-btn--tonal w-full" data-dom-id="btn-select-file">
          <i data-lucide="folder-open" class="w-5 h-5"></i>
          <span>选择文件/目录</span>
        </button>
        <p class="selected-path mt-3 text-sm text-muted-foreground font-mono">Documents/backup.tar.gz</p>
      </section>

      <section class="oci-card">
        <label for="input-ref" class="oci-label">仓库引用</label>
        <input id="input-ref" data-dom-id="input-ref" type="text" class="oci-input" placeholder="registry.example.com/myteam/files:latest" value="registry.example.com/work/files:v1.2">
      </section>

      <section class="oci-card">
        <label for="input-passphrase" class="oci-label">加密口令</label>
        <input id="input-passphrase" data-dom-id="input-passphrase" type="password" class="oci-input" placeholder="请输入加密口令（可选）">
        <label class="checkbox-wrap">
          <input type="checkbox" id="toggle-passphrase">
          <span>显示口令</span>
        </label>
      </section>

      <section class="oci-card">
        <h2 class="text-base font-semibold text-foreground mb-3">标签</h2>
        <div class="mb-3">
          <div class="tag-row">
            <span class="font-mono text-sm text-foreground">app=myapp</span>
            <button type="button" class="oci-btn p-1 text-muted-foreground" aria-label="删除 app=myapp">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="tag-row">
            <span class="font-mono text-sm text-foreground">env=prod</span>
            <button type="button" class="oci-btn p-1 text-muted-foreground" aria-label="删除 env=prod">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <button type="button" class="oci-btn oci-btn--tonal w-full" data-dom-id="btn-add-label">
          <i data-lucide="plus" class="w-5 h-5"></i>
          <span>添加标签</span>
        </button>
      </section>
    

</main>

    <footer class="action-area">
      <button type="button" class="oci-btn oci-btn--primary mb-4" data-dom-id="btn-push">
        <i data-lucide="upload-cloud" class="w-5 h-5"></i>
        <span>开始推送</span>
      </button>
      <div data-dom-id="progress-push" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="推送进度">
        <div class="progress-track">
          <div class="progress-fill" style="width: 0%;"></div>
        </div>
        <p class="mt-2 text-xs text-center text-muted-foreground">等待开始</p>
      </div>
    </footer>

    <script>
      document.getElementById('toggle-passphrase').addEventListener('change', function () {
        var input = document.getElementById('input-passphrase');
        input.type = this.checked ? 'text' : 'password';
      });
      lucide.createIcons();
    </script>
    <nav data-mobile-nav="global" class="w-full border-t border-[var(--oci-line)] bg-[var(--oci-surface)]">
  <div class="w-full max-w-md mx-auto grid grid-cols-3 h-[64px]">
        <a href="home.html" data-nav-key="home" data-dom-id="nav-home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--oci-primary)] font-medium">
          <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span>
        </a>
        <a href="browse.html" data-nav-key="browse" data-dom-id="nav-browse" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--oci-ink-3)]">
          <i data-lucide="package" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">仓库</span>
        </a>
        <a href="history.html" data-nav-key="history" data-dom-id="nav-history" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--oci-ink-3)]">
          <i data-lucide="clock" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">历史</span>
        </a>
      </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
